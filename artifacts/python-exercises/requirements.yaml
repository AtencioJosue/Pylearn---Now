packages:
  "framer-motion": "For smooth page transitions, progress bar animations, and feedback popups."
  "react-syntax-highlighter": "Essential for rendering Python code blocks with syntax highlighting in exercises."
  "@types/react-syntax-highlighter": "Type definitions for react-syntax-highlighter."
  "lucide-react": "For UI icons like checkmarks, crosses, hints, and navigation."
  "clsx": "Utility for constructing className strings conditionally."
  "tailwind-merge": "Utility for merging tailwind classes without style conflicts."

